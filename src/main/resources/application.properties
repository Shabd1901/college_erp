spring.application.name=college-erp

# PostgreSQL Database Connection Settings
# Update username and password as per your local postgres installation
spring.datasource.url=jdbc:postgresql://localhost:5432/college_erp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
# update is used to automatically create or update tables based on entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=8080
